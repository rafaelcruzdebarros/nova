<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Barros</title>
  <meta name="description" content="Portfólio da família de Barros: impressão 3D, software e invenções de um pai e dois filhos.">
  <meta name="theme-color" content="#0f1419">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1419'/%3E%3Ctext x='32' y='45' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='34' text-anchor='middle' fill='%23ff7a2f'%3E3D%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="mark" href="#">3D Barros</a>
      <nav aria-label="Seções">
        <a href="#matheus">Matheus</a>
        <a href="#rafael">Rafael</a>
        <a href="#andre">André</a>
        <a href="#pecas">Peças</a>
        <a href="https://github.com/rafaelcruzdebarros/nova">GitHub</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="titulo">
        <h1 id="titulo" class="logo" aria-label="3D Barros">
          <span class="layers" aria-hidden="true">3D</span>
          <span class="name" aria-hidden="true">Barros</span>
        </h1>
        <div class="hero-txt">
          <p class="lead">Impressão 3D, software e invenções. Um pai, dois filhos e uma oficina em casa.</p>
          <p class="hero-links">
            <a class="btn" href="pecas/">Peças impressas</a>
            <a class="btn ghost" href="#quem">Projetos</a>
          </p>
        </div>
      </section>

      <section id="quem" class="quem" aria-labelledby="h-quem">
        <h2 id="h-quem" class="visually-hidden">Quem faz</h2>
        <div class="pessoas" id="pessoas"></div>
      </section>

      <div id="secoes"></div>

      <section id="pecas" class="oficina" aria-labelledby="h-oficina">
        <div class="oficina-txt">
          <h2 id="h-oficina">Peças impressas</h2>
          <p id="oficinaQtd"></p>
          <a class="btn" href="pecas/">Abrir a galeria</a>
        </div>
        <div class="oficina-grid" id="oficinaGrid"></div>
      </section>
    </main>

    <footer>
      <span>3dbarros.com.br</span>
      <span>feito em casa pelos de Barros</span>
    </footer>
  </div>

  <script src="projetos.js"></script>
  <script src="pecas/pecas.js"></script>
  <script>
    (function () {
      var pessoas = (typeof PESSOAS !== 'undefined' && Array.isArray(PESSOAS)) ? PESSOAS : [];
      var projetos = (typeof PROJETOS !== 'undefined' && Array.isArray(PROJETOS)) ? PROJETOS : [];
      var pecas = (typeof PECAS !== 'undefined' && Array.isArray(PECAS)) ? PECAS : [];
      var cores = ['coral', 'sol', 'mar'];
      var elPessoas = document.getElementById('pessoas');
      var elSecoes = document.getElementById('secoes');

      function el(tag, cls, texto) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (texto != null) e.textContent = texto;
        return e;
      }
      function corValida(c, padrao) { return cores.indexOf(c) >= 0 ? c : padrao; }
      function quemFez(p) { return String(p.quem || '').trim().toLowerCase(); }
      function doId(id) { return function (p) { return quemFez(p) === id; }; }
      function plural(n, um, varios) { return n === 1 ? '1 ' + um : n + ' ' + varios; }

      function tile(p, corPadrao) {
        var a = el('a', 'tile ' + corValida(p.cor, corPadrao));
        a.href = p.link || '#';
        if (/^https?:\/\//.test(a.href)) { a.target = '_blank'; a.rel = 'noopener'; }
        var head = el('div', 'tile-head');
        if (p.emoji) head.appendChild(el('span', 'tile-ico', p.emoji));
        head.appendChild(el('h3', null, p.nome || 'Sem nome'));
        a.appendChild(head);
        a.appendChild(el('p', null, p.descricao || ''));
        if (p.quando) a.appendChild(el('span', 'tile-meta', p.quando));
        return a;
      }

      pessoas.forEach(function (ps, i) {
        var cor = corValida(ps.cor, cores[i % cores.length]);
        var meus = projetos.filter(doId(ps.id));
        var minhas = pecas.filter(doId(ps.id));

        var a = el('a', 'pessoa ' + cor);
        a.href = '#' + ps.id;
        a.appendChild(el('h3', null, ps.nome || ps.id));
        if (ps.papel) a.appendChild(el('span', 'papel', ps.papel));
        if (ps.frase) a.appendChild(el('p', 'frase', ps.frase));
        var num = el('span', 'num');
        num.appendChild(el('span', null, plural(meus.length, 'projeto', 'projetos')));
        num.appendChild(el('span', null, plural(minhas.length, 'peça impressa', 'peças impressas')));
        a.appendChild(num);
        elPessoas.appendChild(a);

        var sec = el('section', 'secao ' + cor);
        sec.id = ps.id;
        sec.setAttribute('aria-labelledby', 'h-' + ps.id);
        var head = el('div', 'secao-head');
        head.appendChild(el('h2', null, ps.nome || ps.id)).id = 'h-' + ps.id;
        if (ps.papel) head.appendChild(el('span', 'papel', ps.papel));
        sec.appendChild(head);
        if (meus.length) {
          var grid = el('div', 'tiles');
          meus.forEach(function (p) { grid.appendChild(tile(p, cor)); });
          sec.appendChild(grid);
        } else {
          sec.appendChild(el('p', 'vazio', 'Nenhum projeto publicado ainda.'));
        }
        elSecoes.appendChild(sec);
      });

      var ids = pessoas.map(function (ps) { return ps.id; });
      var emFamilia = projetos.filter(function (p) { return ids.indexOf(quemFez(p)) < 0; });
      if (emFamilia.length) {
        var sec = el('section', 'secao');
        sec.id = 'todos';
        var head = el('div', 'secao-head');
        head.appendChild(el('h2', null, 'Feito pelos três'));
        sec.appendChild(head);
        var grid = el('div', 'tiles');
        emFamilia.forEach(function (p) { grid.appendChild(tile(p, 'coral')); });
        sec.appendChild(grid);
        elSecoes.appendChild(sec);
      }

      // Peças: contagem e as últimas com foto
      document.getElementById('oficinaQtd').textContent =
        pecas.length ? plural(pecas.length, 'peça na galeria', 'peças na galeria') : 'As primeiras peças estão a caminho.';
      var og = document.getElementById('oficinaGrid');
      var comFoto = pecas.filter(function (p) { return p.foto; }).slice(-4).reverse();
      if (comFoto.length) {
        comFoto.forEach(function (p) {
          var a = el('a', 'foto');
          a.href = 'pecas/';
          var img = el('img');
          img.src = 'pecas/' + p.foto; img.alt = p.nome || 'Peça impressa em 3D'; img.loading = 'lazy';
          a.appendChild(img);
          a.appendChild(el('span', null, p.nome || ''));
          og.appendChild(a);
        });
      } else {
        for (var k = 0; k < 4; k++) og.appendChild(el('div', 'foto vazia'));
      }
    })();
  </script>
</body>
</html>
