<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peças impressas em 3D · 3D Barros</title>
  <meta name="description" content="Galeria das peças que saíram da impressora 3D da família de Barros.">
  <meta name="theme-color" content="#0f1419">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b4a'/%3E%3Ctext x='32' y='46' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='38' text-anchor='middle' fill='%23fff'%3E3D%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site.css">
  <style>
    .hero { padding: 36px 0 8px; display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
    .hero h1 { font-size: clamp(34px, 5vw, 56px); }
    .hero .lead { margin: 6px 0 0; font-size: 16px; }
    .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 26px 0 20px; }
    .filtro {
      border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 13px;
      padding: 7px 12px; border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    }
    .filtro i { width: 10px; height: 10px; background: var(--c, var(--ink)); display: inline-block; }
    .filtro:hover { color: var(--ink); border-color: var(--c, var(--ink)); }
    .filtro.ativo { color: var(--ink); border-color: var(--c, var(--ink)); background: var(--surface); }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); padding-bottom: 48px; }
    .peca { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
    .peca:hover { border-color: var(--c, var(--ink)); }
    .foto { display: block; aspect-ratio: 4 / 3; background: var(--plate); border: 0; padding: 0; width: 100%; cursor: zoom-in; font: inherit; border-bottom: 3px solid var(--c, var(--line)); border-radius: 0; }
    .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .foto.sem { cursor: default; display: grid; place-items: center; color: var(--muted); background-image: repeating-linear-gradient(to top, var(--line) 0 1px, transparent 1px 7px); }
    .foto.sem::after { content: ""; width: 40px; height: 40px; border: 2px solid var(--line); transform: rotate(45deg); }
    .peca .txt { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .peca h2 { margin: 0; font-size: 20px; }
    .peca p { margin: 0; color: var(--muted); font-size: 14.5px; flex: 1; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .meta span { border: 1px solid var(--line); border-radius: var(--radius); padding: 2px 8px; display: inline-flex; align-items: center; gap: 6px; }
    .meta i { width: 8px; height: 8px; background: var(--c); display: inline-block; }
    .meta a { color: var(--ink); }
    .vazio { border: 1px dashed var(--line); border-radius: var(--radius); padding: 40px 24px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
    .vazio b { display: block; color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: 22px; margin-bottom: 6px; }
    .vazio code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
    dialog { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1100px); max-height: 94vh; }
    dialog::backdrop { background: rgba(5, 8, 12, .88); }
    dialog img { width: min(92vw, 1000px); max-height: 86vh; object-fit: contain; display: block; border-radius: var(--radius); background: #000; }
    dialog figcaption { color: var(--ink); text-align: center; margin-top: 10px; font-weight: 700; }
    dialog button { position: absolute; top: -6px; right: -6px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: var(--plate); font-size: 22px; cursor: pointer; }
    dialog figure { margin: 0; position: relative; }
    .top nav a.voltar { color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="mark" href="../">3D Barros</a>
      <nav aria-label="Navegação"><a class="voltar" href="../">Voltar para a home</a></nav>
    </header>

    <main>
      <section class="hero">
        <div>
          <h1>Peças impressas em 3D</h1>
          <p class="lead">O que já saiu da nossa impressora.</p>
        </div>
      </section>

      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por quem fez"></div>
      <div class="grid" id="grid"></div>
    </main>

    <footer>3dbarros.com.br · feito pelos de Barros</footer>
  </div>

  <dialog id="zoom">
    <figure>
      <button type="button" id="fechar" aria-label="Fechar">×</button>
      <img id="zoomImg" alt="">
      <figcaption id="zoomTxt"></figcaption>
    </figure>
  </dialog>

  <script>
    // Dados carregados com carimbo de hora, para o navegador não usar a versão antiga do cache.
    function carregarDados(arquivos, pronto) {
      var faltam = arquivos.length, t = Date.now();
      arquivos.forEach(function (src) {
        var s = document.createElement('script');
        s.src = src + '?t=' + t;
        s.onload = s.onerror = function () { if (--faltam === 0) pronto(); };
        document.head.appendChild(s);
      });
    }
    carregarDados(['../projetos.js', 'pecas.js'], function () {
      var pessoas = (typeof PESSOAS !== 'undefined' && Array.isArray(PESSOAS)) ? PESSOAS : [];
      var pecas = (typeof PECAS !== 'undefined' && Array.isArray(PECAS)) ? PECAS : [];
      var cores = ['coral', 'sol', 'mar'];
      var grid = document.getElementById('grid');
      var filtros = document.getElementById('filtros');
      var zoom = document.getElementById('zoom');
      var zoomImg = document.getElementById('zoomImg');
      var zoomTxt = document.getElementById('zoomTxt');
      var atual = 'todas';

      function el(tag, cls, texto) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (texto != null) e.textContent = texto;
        return e;
      }
      function pessoa(id) {
        id = String(id || '').trim().toLowerCase();
        for (var i = 0; i < pessoas.length; i++) if (pessoas[i].id === id) {
          return { nome: pessoas[i].nome, cor: cores.indexOf(pessoas[i].cor) >= 0 ? pessoas[i].cor : cores[i % cores.length] };
        }
        return null;
      }

      function cardPeca(p) {
        var quem = pessoa(p.quem);
        var cor = quem ? quem.cor : 'coral';
        var art = el('article', 'peca ' + cor);
        if (p.foto) {
          var btn = el('button', 'foto');
          btn.type = 'button';
          var img = el('img');
          img.src = p.foto; img.alt = p.nome || 'Peça impressa em 3D'; img.loading = 'lazy';
          btn.appendChild(img);
          btn.addEventListener('click', function () {
            zoomImg.src = p.foto; zoomImg.alt = img.alt; zoomTxt.textContent = p.nome || '';
            zoom.showModal();
          });
          art.appendChild(btn);
        } else {
          art.appendChild(el('div', 'foto sem'));
        }
        var txt = el('div', 'txt');
        txt.appendChild(el('h2', null, p.nome || 'Sem nome'));
        txt.appendChild(el('p', null, p.descricao || ''));
        var meta = el('div', 'meta');
        if (quem) { var q = el('span'); q.appendChild(el('i')); q.appendChild(document.createTextNode(quem.nome)); meta.appendChild(q); }
        else if (String(p.quem || '').toLowerCase() === 'todos') meta.appendChild(el('span', null, 'os 3'));
        if (p.material) meta.appendChild(el('span', null, p.material));
        if (p.quando) meta.appendChild(el('span', null, p.quando));
        if (p.modelo) { var m = el('span'); var a = el('a', null, 'modelo 3D'); a.href = p.modelo; a.target = '_blank'; a.rel = 'noopener'; m.appendChild(a); meta.appendChild(m); }
        if (meta.childNodes.length) txt.appendChild(meta);
        art.appendChild(txt);
        return art;
      }

      function render() {
        grid.innerHTML = '';
        var lista = pecas.filter(function (p) {
          return atual === 'todas' || String(p.quem || '').trim().toLowerCase() === atual;
        });
        if (!lista.length) {
          var v = el('div', 'vazio');
          v.appendChild(el('b', null, pecas.length ? 'Nada por aqui ainda' : 'Nenhuma peça ainda'));
          var t = el('span', null, pecas.length ? 'Essa pessoa ainda não cadastrou peça nenhuma.' : 'Tire uma foto da primeira peça, salve em ');
          v.appendChild(t);
          if (!pecas.length) { v.appendChild(el('code', null, 'pecas/fotos/')); v.appendChild(document.createTextNode(' e anote em ')); v.appendChild(el('code', null, 'pecas/pecas.js')); v.appendChild(document.createTextNode('.')); }
          grid.appendChild(v);
          return;
        }
        lista.forEach(function (p) { grid.appendChild(cardPeca(p)); });
      }

      function filtro(id, nome, cor) {
        var b = el('button', 'filtro' + (cor ? ' ' + cor : ''));
        b.type = 'button';
        if (cor) b.appendChild(el('i'));
        b.appendChild(document.createTextNode(nome));
        b.dataset.id = id;
        b.addEventListener('click', function () {
          atual = id;
          Array.prototype.forEach.call(filtros.children, function (c) { c.classList.toggle('ativo', c.dataset.id === id); });
          render();
        });
        filtros.appendChild(b);
      }
      filtro('todas', 'Todas', null);
      pessoas.forEach(function (ps, i) { filtro(ps.id, ps.nome, cores.indexOf(ps.cor) >= 0 ? ps.cor : cores[i % cores.length]); });
      filtros.firstChild.classList.add('ativo');

      document.getElementById('fechar').addEventListener('click', function () { zoom.close(); });
      zoom.addEventListener('click', function (e) { if (e.target === zoom) zoom.close(); });

      render();
    });
  </script>
</body>
</html>
