<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · 3D Barros</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="4; url=/">
  <style>
    :root { --bg:#fff8f1; --ink:#1f2430; --muted:#67707f; --coral:#ff6b4a; --coral-dark:#c23f22; }
    @media (prefers-color-scheme: dark) { :root { --bg:#14171f; --ink:#f1f3f8; --muted:#a2abbb; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
      font-family: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); padding:16px; }
    .n { font-family: "Baloo 2", "Arial Black", sans-serif; font-weight:800; font-size:clamp(72px,20vw,160px); line-height:1; color:var(--coral);
      text-shadow: 2px 2px 0 var(--coral-dark), 4px 4px 0 var(--coral-dark), 6px 6px 0 var(--coral-dark), 8px 8px 0 var(--coral-dark); }
    h1 { font-size:26px; margin:18px 0 6px; }
    p { color:var(--muted); margin:0 0 22px; }
    a { display:inline-block; background:var(--coral); color:#fff; text-decoration:none; font-weight:700;
      padding:12px 22px; border-radius:999px; box-shadow:0 4px 0 var(--coral-dark); }
  </style>
</head>
<body>
  <div>
    <div class="n" aria-hidden="true">404</div>
    <h1>Essa página não existe (ainda).</h1>
    <p>Em alguns segundos você volta para a home do 3D Barros.</p>
    <a href="/">Ir para a home agora</a>
  </div>
</body>
</html>
